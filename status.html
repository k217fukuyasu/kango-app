<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>部長室在室ボード</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%AA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #f5f7f2;
    --surface: #ffffff;
    --surface-2: #edf1e8;
    --border: #d9e0d1;
    --ink: #1e2a22;
    --muted: #5c6b5b;
    --muted-2: #849081;
    --accent: #2f7c6e;
    --accent-strong: #1f6357;
    --accent-ink: #ffffff;
    --accent-soft: #e2f0ea;
    --focus: #2f7c6e;

    --present-bg: #e5f2e6;
    --present-fg: #1f6b3d;
    --present-strong: #2f8f53;
    --present-border: #bfe0c2;

    --meeting-bg: #fcefd7;
    --meeting-fg: #8a5a12;
    --meeting-strong: #c98a2c;
    --meeting-border: #f0d6a3;

    --away-bg: #e8eef5;
    --away-fg: #33526e;
    --away-strong: #5c7a99;
    --away-border: #c9d8e6;

    --out-bg: #f7e8e2;
    --out-fg: #8c3b2c;
    --out-strong: #b5493b;
    --out-border: #edc9bd;

    --shadow-1: 0 1px 2px rgba(30, 42, 34, 0.06);
    --shadow-2: 0 10px 28px -14px rgba(30, 42, 34, 0.28);

    --font-display: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
    --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    --font-mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #10160f;
      --surface: #182119;
      --surface-2: #1f2b21;
      --border: #2c3a2c;
      --ink: #e9f0e6;
      --muted: #a3b19f;
      --muted-2: #7d8b79;
      --accent: #5fbba0;
      --accent-strong: #7fd0b6;
      --accent-ink: #08150f;
      --accent-soft: #1d372e;
      --focus: #7fd0b6;

      --present-bg: #17301f;
      --present-fg: #86d99e;
      --present-strong: #52c97d;
      --present-border: #234d2e;

      --meeting-bg: #3a2c12;
      --meeting-fg: #f0c46e;
      --meeting-strong: #e0a23e;
      --meeting-border: #5a4419;

      --away-bg: #1b2c3b;
      --away-fg: #9cc3e6;
      --away-strong: #6e97bc;
      --away-border: #2a445c;

      --out-bg: #3a2119;
      --out-fg: #f0a294;
      --out-strong: #d9695a;
      --out-border: #5c3227;

      --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-2: 0 12px 28px -14px rgba(0, 0, 0, 0.6);
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #10160f;
    --surface: #182119;
    --surface-2: #1f2b21;
    --border: #2c3a2c;
    --ink: #e9f0e6;
    --muted: #a3b19f;
    --muted-2: #7d8b79;
    --accent: #5fbba0;
    --accent-strong: #7fd0b6;
    --accent-ink: #08150f;
    --accent-soft: #1d372e;
    --focus: #7fd0b6;

    --present-bg: #17301f;
    --present-fg: #86d99e;
    --present-strong: #52c97d;
    --present-border: #234d2e;

    --meeting-bg: #3a2c12;
    --meeting-fg: #f0c46e;
    --meeting-strong: #e0a23e;
    --meeting-border: #5a4419;

    --away-bg: #1b2c3b;
    --away-fg: #9cc3e6;
    --away-strong: #6e97bc;
    --away-border: #2a445c;

    --out-bg: #3a2119;
    --out-fg: #f0a294;
    --out-strong: #d9695a;
    --out-border: #5c3227;

    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-2: 0 12px 28px -14px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .brand-eyebrow {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--muted-2);
    margin-bottom: 6px;
  }

  .home-link {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent-strong);
    text-decoration: none;
    margin-bottom: 6px;
    display: inline-block;
  }
  .home-link:hover { text-decoration: underline; }

  .topbar h1 {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: clamp(20px, 3vw, 28px);
    margin: 0;
    letter-spacing: 0.01em;
  }

  .clock-wrap {
    text-align: right;
  }

  .clock {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: clamp(24px, 4vw, 34px);
    line-height: 1;
    color: var(--accent-strong);
  }

  .clock-date {
    margin-top: 4px;
    font-size: 13px;
    color: var(--muted);
  }

  .layout {
    display: grid;
    gap: 20px;
    grid-template-columns: 1fr;
  }

  @media (min-width: 900px) {
    .layout {
      grid-template-columns: 1.05fr 0.95fr;
      align-items: start;
    }
    .status-panel { grid-column: 1; grid-row: 1; }
    .selector-panel { grid-column: 1; grid-row: 2; }
    .queue-panel { grid-column: 2; grid-row: 1 / 3; }
  }

  .status-panel {
    border-radius: 20px;
    padding: 28px;
    background: var(--present-bg);
    color: var(--present-fg);
    border: 1px solid var(--present-border);
    box-shadow: var(--shadow-2);
    transition: background 0.35s ease, border-color 0.35s ease, color 0.35s ease;
  }

  .status-panel[data-state="meeting"] { background: var(--meeting-bg); color: var(--meeting-fg); border-color: var(--meeting-border); }
  .status-panel[data-state="away"] { background: var(--away-bg); color: var(--away-fg); border-color: var(--away-border); }
  .status-panel[data-state="out"] { background: var(--out-bg); color: var(--out-fg); border-color: var(--out-border); }

  .status-top {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .status-icon {
    width: 52px;
    height: 52px;
    flex: none;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .status-panel[data-state] .status-icon svg { width: 28px; height: 28px; }

  :root[data-theme="dark"] .status-icon { background: rgba(0, 0, 0, 0.28); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .status-icon { background: rgba(0, 0, 0, 0.28); }
  }

  .status-eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    opacity: 0.8;
    display: block;
    margin-bottom: 4px;
  }

  .status-label {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: clamp(40px, 7vw, 64px);
    line-height: 1.02;
    letter-spacing: 0.01em;
  }

  .status-sub {
    margin-top: 6px;
    font-size: 15px;
    font-weight: 500;
    opacity: 0.9;
  }

  .status-meta {
    margin-top: 18px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0.85;
  }

  .status-meta .mono-num {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  .status-note {
    margin-top: 14px;
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.55);
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
  }

  :root[data-theme="dark"] .status-note { background: rgba(0, 0, 0, 0.22); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .status-note { background: rgba(0, 0, 0, 0.22); }
  }

  .status-note strong { font-weight: 700; }

  .note-toggle {
    margin-top: 14px;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    opacity: 0.85;
  }

  .note-toggle:hover { opacity: 1; }

  .note-form {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .note-form input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(0, 0, 0, 0.15);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 14px;
  }

  .note-form-actions {
    display: flex;
    gap: 8px;
  }

  .section-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 16px;
    margin: 0 0 12px;
    color: var(--ink);
  }

  .selector-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px;
    box-shadow: var(--shadow-1);
    margin-top: 20px;
  }

  @media (min-width: 900px) { .selector-panel { margin-top: 0; } }

  .status-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  @media (min-width: 520px) and (max-width: 899px) {
    .status-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .status-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 16px 8px 14px;
    border-radius: 14px;
    border: 1.5px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    cursor: pointer;
    font: inherit;
    transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }

  .status-btn:hover { transform: translateY(-1px); }
  .status-btn:active { transform: translateY(0); }

  .status-btn svg { width: 24px; height: 24px; }

  .status-btn-label {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
  }

  .status-btn[data-state="present"] { color: var(--present-strong); }
  .status-btn[data-state="meeting"] { color: var(--meeting-strong); }
  .status-btn[data-state="away"] { color: var(--away-strong); }
  .status-btn[data-state="out"] { color: var(--out-strong); }

  .status-btn[aria-pressed="true"][data-state="present"] { background: var(--present-bg); border-color: var(--present-strong); }
  .status-btn[aria-pressed="true"][data-state="meeting"] { background: var(--meeting-bg); border-color: var(--meeting-strong); }
  .status-btn[aria-pressed="true"][data-state="away"] { background: var(--away-bg); border-color: var(--away-strong); }
  .status-btn[aria-pressed="true"][data-state="out"] { background: var(--out-bg); border-color: var(--out-strong); }

  .queue-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px;
    box-shadow: var(--shadow-1);
    margin-top: 20px;
    display: flex;
    flex-direction: column;
  }

  @media (min-width: 900px) { .queue-panel { margin-top: 0; } }

  .queue-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .queue-count {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 13px;
    color: var(--accent-strong);
    background: var(--accent-soft);
    padding: 3px 10px;
    border-radius: 999px;
  }

  .queue-list {
    list-style: none;
    margin: 0 0 6px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .queue-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface-2);
  }

  .queue-order {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 13px;
    color: var(--muted-2);
    width: 20px;
    flex: none;
    text-align: center;
  }

  .queue-info { flex: 1; min-width: 0; }

  .queue-name {
    font-weight: 700;
    font-size: 14.5px;
    color: var(--ink);
    overflow-wrap: anywhere;
  }

  .queue-topic {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
    overflow-wrap: anywhere;
  }

  .queue-wait {
    font-size: 12px;
    color: var(--muted-2);
    margin-top: 2px;
    font-family: var(--font-mono);
  }

  .btn {
    font: inherit;
    font-weight: 700;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    padding: 10px 16px;
    transition: filter 0.15s ease, transform 0.1s ease;
  }

  .btn:active { transform: translateY(1px); }

  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.06); }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1.5px solid var(--border);
  }

  .btn-sm { padding: 7px 12px; font-size: 13px; }

  .btn-done {
    flex: none;
    background: var(--surface);
    color: var(--accent-strong);
    border: 1.5px solid var(--accent);
    font-size: 12.5px;
    padding: 7px 11px;
    border-radius: 8px;
  }

  .btn-done:hover { background: var(--accent-soft); }

  .queue-empty {
    color: var(--muted-2);
    font-size: 14px;
    padding: 18px 4px 22px;
    text-align: center;
  }

  .queue-form {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px dashed var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .queue-form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  @media (max-width: 420px) { .queue-form-row { grid-template-columns: 1fr; } }

  .queue-form input[type="text"] {
    width: 100%;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
    font: inherit;
    font-size: 14px;
  }

  .queue-form input[type="text"]:focus,
  .note-form input[type="text"]:focus,
  .status-btn:focus-visible,
  .btn:focus-visible {
    outline: 2.5px solid var(--focus);
    outline-offset: 2px;
  }

  .foot-note {
    margin-top: 22px;
    text-align: center;
    font-size: 12.5px;
    color: var(--muted-2);
  }

  .sync-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--present-strong);
    margin-right: 6px;
    vertical-align: middle;
  }

  .sync-dot.offline { background: var(--out-strong); }
  .sync-dot.connecting { background: var(--muted-2); }
  .sync-dot.error { background: var(--meeting-strong); }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand">
      <span class="brand-eyebrow">TMCH 看護部</span><br>
      <a class="home-link" href="index.html">← アプリ一覧へ</a>
      <h1>看護部長室 在室状況ボード</h1>
    </div>
    <div class="clock-wrap">
      <div class="clock" id="clock">--:--</div>
      <div class="clock-date" id="clockDate">----年--月--日(-)</div>
    </div>
  </header>

  <main class="layout">
    <section class="status-panel" id="statusPanel" data-state="present" aria-live="polite">
      <div class="status-top">
        <div class="status-icon" id="statusIcon"></div>
        <div>
          <span class="status-eyebrow">現在の状況</span>
          <div class="status-label" id="statusLabel">在室</div>
        </div>
      </div>
      <div class="status-sub" id="statusSub">ご相談いただけます</div>
      <div class="status-meta">更新: <span class="mono-num" id="statusUpdatedTime">--:--</span>　<span id="statusUpdatedRel">たった今</span></div>

      <div class="status-note" id="statusNoteView" hidden>
        <strong>メモ：</strong><span id="statusNoteText"></span>
      </div>

      <button class="note-toggle" id="noteToggleBtn" type="button">メモを追加・編集する</button>
      <form class="note-form" id="noteForm" hidden>
        <input type="text" id="noteInput" maxlength="60" placeholder="例）15:30頃 戻ります／〇〇会議のため">
        <div class="note-form-actions">
          <button type="submit" class="btn btn-primary btn-sm">保存する</button>
          <button type="button" class="btn btn-ghost btn-sm" id="noteCancelBtn">キャンセル</button>
        </div>
      </form>
    </section>

    <section class="selector-panel">
      <h2 class="section-title">状況を変更する（どなたでも更新できます）</h2>
      <div class="status-grid" id="statusGrid">
        <button class="status-btn" type="button" data-state="present" aria-pressed="true">
          <span class="icon-slot" data-icon="present"></span>
          <span class="status-btn-label">在室</span>
        </button>
        <button class="status-btn" type="button" data-state="meeting" aria-pressed="false">
          <span class="icon-slot" data-icon="meeting"></span>
          <span class="status-btn-label">面談中</span>
        </button>
        <button class="status-btn" type="button" data-state="away" aria-pressed="false">
          <span class="icon-slot" data-icon="away"></span>
          <span class="status-btn-label">離席</span>
        </button>
        <button class="status-btn" type="button" data-state="out" aria-pressed="false">
          <span class="icon-slot" data-icon="out"></span>
          <span class="status-btn-label">不在</span>
        </button>
      </div>
    </section>

    <section class="queue-panel">
      <div class="queue-header">
        <h2 class="section-title" style="margin-bottom:0;">相談待ちリスト</h2>
        <span class="queue-count" id="queueCount">0件</span>
      </div>

      <ol class="queue-list" id="queueList"></ol>
      <p class="queue-empty" id="queueEmpty">現在、相談待ちの方はいません。</p>

      <form class="queue-form" id="queueForm">
        <div class="queue-form-row">
          <input type="text" id="queueName" maxlength="20" placeholder="お名前（任意）">
          <input type="text" id="queueTopic" maxlength="40" placeholder="ご用件（任意）">
        </div>
        <button type="submit" class="btn btn-primary">相談待ちに入る</button>
      </form>
    </section>
  </main>

  <footer class="foot-note">
    <span class="sync-dot" id="syncDot"></span><span id="syncState">同期状況を確認中…</span>
  </footer>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import {
    getFirestore, doc, collection, onSnapshot, setDoc, addDoc, deleteDoc, query, orderBy, limit
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  var firebaseConfig = {
    apiKey: "AIzaSyAN1iKGBzu-1tcgJOGee4ePyLVz4_ubz_U",
    authDomain: "kangobuai.firebaseapp.com",
    projectId: "kangobuai",
    storageBucket: "kangobuai.firebasestorage.app",
    messagingSenderId: "816364571788",
    appId: "1:816364571788:web:6ca8ebd2822b3031a23fa9",
    measurementId: "G-Z23VVKNG9Q"
  };

  var STATE_LABEL = { present: "在室", meeting: "面談中", away: "離席", out: "不在" };
  var STATE_SUB = {
    present: "ご相談いただけます",
    meeting: "終了まで少々お待ちください",
    away: "まもなく戻ります",
    out: "本日は不在です・緊急時は師長へ"
  };

  var ICONS = {
    present:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M6 3h9v18H6"/><path d="M15 3l3 1.5V21l-3-1.5"/><circle cx="10.2" cy="12" r="0.9" fill="currentColor" stroke="none"/></svg>',
    meeting:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M4 6.5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2V12a2 2 0 0 1-2 2H9l-3.2 2.6A0.6 0.6 0 0 1 5 16.1V14H6a2 2 0 0 1-2-2z"/>' +
      '<path d="M14 8h2.5A2 2 0 0 1 19 10v3.3a2 2 0 0 1-2 2h-.3v1.8c0 .4-.5.6-.8.4L14 16"/></svg>',
    away:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M8 10c0-2.2 1.8-4 4-4s4 1.8 4 4v1a4 4 0 0 1-4 4H9.5"/>' +
      '<path d="M6 15h9a3 3 0 0 1 3 3v.5H6z"/><path d="M16 5.5c.9 0 1.6.6 1.6 1.4"/></svg>',
    out:
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="6" y="3" width="12" height="18" rx="1"/><circle cx="14" cy="12" r="0.9" fill="currentColor" stroke="none"/>' +
      '<path d="M3 21h18" stroke-width="1.4"/></svg>'
  };

  var els = {
    clock: document.getElementById("clock"),
    clockDate: document.getElementById("clockDate"),
    statusPanel: document.getElementById("statusPanel"),
    statusIcon: document.getElementById("statusIcon"),
    statusLabel: document.getElementById("statusLabel"),
    statusSub: document.getElementById("statusSub"),
    statusUpdatedTime: document.getElementById("statusUpdatedTime"),
    statusUpdatedRel: document.getElementById("statusUpdatedRel"),
    statusNoteView: document.getElementById("statusNoteView"),
    statusNoteText: document.getElementById("statusNoteText"),
    noteToggleBtn: document.getElementById("noteToggleBtn"),
    noteForm: document.getElementById("noteForm"),
    noteInput: document.getElementById("noteInput"),
    noteCancelBtn: document.getElementById("noteCancelBtn"),
    statusGrid: document.getElementById("statusGrid"),
    queueList: document.getElementById("queueList"),
    queueEmpty: document.getElementById("queueEmpty"),
    queueCount: document.getElementById("queueCount"),
    queueForm: document.getElementById("queueForm"),
    queueName: document.getElementById("queueName"),
    queueTopic: document.getElementById("queueTopic"),
    syncDot: document.getElementById("syncDot"),
    syncState: document.getElementById("syncState")
  };

  document.querySelectorAll(".icon-slot").forEach(function (el) {
    el.innerHTML = ICONS[el.getAttribute("data-icon")];
  });
  els.statusIcon.innerHTML = ICONS.present;

  var currentStatus = { state: "present", note: "", updatedAt: new Date().toISOString() };
  var queueItems = [];
  var dbReady = false;
  var statusDocRef = null;
  var queueColRef = null;
  var submittingQueue = false;
  var submittingNote = false;

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function tickClock() {
    var now = new Date();
    els.clock.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
    var days = ["日", "月", "火", "水", "木", "金", "土"];
    els.clockDate.textContent = now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日(" + days[now.getDay()] + ")";
  }

  function relativeTime(iso) {
    if (!iso) return "";
    var diffMs = Date.now() - new Date(iso).getTime();
    var mins = Math.floor(diffMs / 60000);
    if (mins < 1) return "たった今";
    if (mins < 60) return mins + "分前";
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + "時間" + (mins % 60 ? (mins % 60) + "分" : "") + "前";
    var days = Math.floor(hrs / 24);
    return days + "日前";
  }

  function timeOnly(iso) {
    if (!iso) return "--:--";
    var d = new Date(iso);
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function setSync(kind, text) {
    els.syncDot.className = "sync-dot" + (kind === "offline" ? " offline" : kind === "error" ? " error" : kind === "connecting" ? " connecting" : "");
    els.syncState.textContent = text;
  }

  function renderStatus() {
    var state = currentStatus.state in STATE_LABEL ? currentStatus.state : "present";
    els.statusPanel.setAttribute("data-state", state);
    els.statusIcon.innerHTML = ICONS[state];
    els.statusLabel.textContent = STATE_LABEL[state];
    els.statusSub.textContent = STATE_SUB[state];
    els.statusUpdatedTime.textContent = timeOnly(currentStatus.updatedAt);
    els.statusUpdatedRel.textContent = "（" + relativeTime(currentStatus.updatedAt) + "）";

    if (currentStatus.note) {
      els.statusNoteText.textContent = currentStatus.note;
      els.statusNoteView.hidden = false;
    } else {
      els.statusNoteView.hidden = true;
    }

    document.querySelectorAll(".status-btn").forEach(function (btn) {
      var pressed = btn.getAttribute("data-state") === state;
      btn.setAttribute("aria-pressed", pressed ? "true" : "false");
    });
  }

  function renderQueue() {
    els.queueList.innerHTML = "";
    els.queueCount.textContent = queueItems.length + "件";
    els.queueEmpty.hidden = queueItems.length > 0;

    queueItems.forEach(function (item, i) {
      var li = document.createElement("li");
      li.className = "queue-item";

      var order = document.createElement("span");
      order.className = "queue-order";
      order.textContent = i + 1;

      var info = document.createElement("div");
      info.className = "queue-info";

      var name = document.createElement("div");
      name.className = "queue-name";
      name.textContent = item.name || "匿名";

      var wait = document.createElement("div");
      wait.className = "queue-wait";
      wait.textContent = "待機" + relativeTime(item.requestedAt) + "・受付 " + timeOnly(item.requestedAt);

      info.appendChild(name);
      if (item.topic) {
        var topic = document.createElement("div");
        topic.className = "queue-topic";
        topic.textContent = item.topic;
        info.appendChild(topic);
      }
      info.appendChild(wait);

      var doneBtn = document.createElement("button");
      doneBtn.className = "btn-done";
      doneBtn.type = "button";
      doneBtn.textContent = "対応済み";
      doneBtn.addEventListener("click", function () { completeQueueItem(item.id); });

      li.appendChild(order);
      li.appendChild(info);
      li.appendChild(doneBtn);
      els.queueList.appendChild(li);
    });
  }

  function applyStatus(newState) {
    var iso = new Date().toISOString();
    if (dbReady && statusDocRef) {
      setDoc(statusDocRef, { state: newState, updatedAt: iso }, { merge: true }).catch(function (e) {
        console.error(e);
        setSync("error", "更新に失敗しました。もう一度お試しください");
      });
    } else {
      currentStatus.state = newState;
      currentStatus.updatedAt = iso;
      renderStatus();
    }
  }

  function saveNote(text) {
    var iso = new Date().toISOString();
    if (dbReady && statusDocRef) {
      submittingNote = true;
      setDoc(statusDocRef, { note: text, updatedAt: iso }, { merge: true }).catch(function (e) {
        console.error(e);
        setSync("error", "メモの保存に失敗しました");
      }).finally(function () { submittingNote = false; });
    } else {
      currentStatus.note = text;
      currentStatus.updatedAt = iso;
      renderStatus();
    }
  }

  function addQueueItem(name, topic) {
    var payload = { name: name || "", topic: topic || "", requestedAt: new Date().toISOString() };
    if (dbReady && queueColRef) {
      submittingQueue = true;
      addDoc(queueColRef, payload).catch(function (e) {
        console.error(e);
        setSync("error", "登録に失敗しました。もう一度お試しください");
      }).finally(function () { submittingQueue = false; });
    } else {
      queueItems.push({ id: "local-" + Date.now(), name: payload.name, topic: payload.topic, requestedAt: payload.requestedAt });
      renderQueue();
    }
  }

  function completeQueueItem(id) {
    if (dbReady && queueColRef) {
      deleteDoc(doc(queueColRef, id)).catch(function (e) {
        console.error(e);
        setSync("error", "更新に失敗しました");
      });
    } else {
      queueItems = queueItems.filter(function (q) { return q.id !== id; });
      renderQueue();
    }
  }

  els.statusGrid.addEventListener("click", function (e) {
    var btn = e.target.closest(".status-btn");
    if (!btn) return;
    applyStatus(btn.getAttribute("data-state"));
  });

  els.noteToggleBtn.addEventListener("click", function () {
    els.noteInput.value = currentStatus.note || "";
    els.noteForm.hidden = false;
    els.noteToggleBtn.hidden = true;
    els.noteInput.focus();
  });

  els.noteCancelBtn.addEventListener("click", function () {
    els.noteForm.hidden = true;
    els.noteToggleBtn.hidden = false;
  });

  els.noteForm.addEventListener("submit", function (e) {
    e.preventDefault();
    if (submittingNote) return;
    var text = els.noteInput.value.trim();
    saveNote(text);
    els.noteForm.hidden = true;
    els.noteToggleBtn.hidden = false;
  });

  els.queueForm.addEventListener("submit", function (e) {
    e.preventDefault();
    if (submittingQueue) return;
    var name = els.queueName.value.trim();
    var topic = els.queueTopic.value.trim();
    addQueueItem(name, topic);
    els.queueName.value = "";
    els.queueTopic.value = "";
  });

  tickClock();
  renderStatus();
  renderQueue();
  setInterval(tickClock, 1000);
  setInterval(function () { renderStatus(); renderQueue(); }, 15000);

  setSync("connecting", "接続しています…");

  try {
    var app = initializeApp(firebaseConfig);
    var auth = getAuth(app);
    var dbFs = getFirestore(app);

    signInAnonymously(auth).then(function () {
      statusDocRef = doc(dbFs, "status", "current");
      queueColRef = collection(dbFs, "queue");
      dbReady = true;
      setSync("online", "リアルタイムで同期しています");

      onSnapshot(statusDocRef, function (snap) {
        if (snap.exists()) {
          var data = snap.data() || {};
          currentStatus = {
            state: data.state || "present",
            note: typeof data.note === "string" ? data.note : "",
            updatedAt: data.updatedAt || currentStatus.updatedAt
          };
        }
        renderStatus();
      }, function (err) {
        console.error(err);
        setSync("error", "同期エラーが発生しました");
      });

      var queueQuery = query(queueColRef, orderBy("requestedAt", "asc"), limit(50));
      onSnapshot(queueQuery, function (snap) {
        queueItems = snap.docs.map(function (d) {
          var data = d.data() || {};
          return { id: d.id, name: data.name || "", topic: data.topic || "", requestedAt: data.requestedAt || null };
        });
        renderQueue();
      }, function (err) {
        console.error(err);
        setSync("error", "同期エラーが発生しました");
      });
    }).catch(function (e) {
      console.error(e);
      setSync("offline", "この画面では自動同期できません（表示のみ）");
    });
  } catch (e) {
    console.error(e);
    setSync("offline", "この画面では自動同期できません（表示のみ）");
  }
</script>
</body>
</html>
